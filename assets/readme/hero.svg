<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">Codex Quota</title>
  <desc id="desc">一个在 macOS 菜单栏切换 Codex 订阅与 DeepSeek、查看额度余额并保留两种来源对话入口的原生工具。</desc>

  <rect width="1200" height="420" rx="28" fill="#1E2030"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#363A4F" stroke-width="2"/>

  <g id="title-block" transform="translate(64 52)"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="0" y="0" dominant-baseline="hanging"
          fill="#A5ADCB" font-size="18" font-weight="650" letter-spacing="3">
      NATIVE MACOS PROVIDER SWITCHER
    </text>
    <text x="0" y="92" fill="#CAD3F5" font-size="72" font-weight="760">
      Codex Quota
    </text>
    <text x="0" y="146" fill="#C59FF7" font-size="28" font-weight="680">
      一个菜单栏，切换两种模型来源。
    </text>
    <text x="0" y="202" fill="#A5ADCB" font-size="22">
      Codex 订阅额度 · DeepSeek 剩余金额
    </text>
    <text x="0" y="238" fill="#A5ADCB" font-size="22">
      具体模型 · API Key · 本机对话入口
    </text>

    <g transform="translate(0 304)"
       font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
       font-size="18" fill="#6E738D">
      <text x="0" y="0">MACOS 14+</text>
      <circle cx="136" cy="-6" r="3" fill="#6E738D"/>
      <text x="154" y="0">APPLE SILICON</text>
      <circle cx="336" cy="-6" r="3" fill="#6E738D"/>
      <text x="354" y="0">APPKIT</text>
      <circle cx="452" cy="-6" r="3" fill="#6E738D"/>
      <text x="470" y="0">V0.2.4</text>
    </g>
  </g>

  <g id="provider-panel" transform="translate(710 28)"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="188" y="0" width="238" height="48" rx="24" fill="#24273A" stroke="#363A4F"/>
    <circle cx="214" cy="24" r="7" fill="#A6DA95"/>
    <text x="232" y="31" fill="#CAD3F5" font-size="20" font-weight="700">DeepSeek</text>
    <text x="402" y="31" text-anchor="end" fill="#A6DA95" font-size="20" font-weight="750">¥110.00</text>

    <rect x="0" y="64" width="454" height="320" rx="22" fill="#24273A" stroke="#363A4F" stroke-width="2"/>
    <text x="28" y="106" fill="#CAD3F5" font-size="25" font-weight="740">Codex Quota</text>
    <text x="426" y="106" text-anchor="end" fill="#A6DA95" font-size="18" font-weight="700">已连接</text>
    <line x1="28" y1="126" x2="426" y2="126" stroke="#363A4F"/>

    <g transform="translate(164 146)">
      <rect width="262" height="42" rx="12" fill="#1E2030" stroke="#363A4F"/>
      <rect x="126" y="2" width="134" height="38" rx="10" fill="#363A4F"/>
      <text x="63" y="28" text-anchor="middle" fill="#A5ADCB" font-size="18" font-weight="650">Codex 订阅</text>
      <text x="193" y="28" text-anchor="middle" fill="#CAD3F5" font-size="18" font-weight="700">DeepSeek</text>
    </g>

    <text x="28" y="230" fill="#A5ADCB" font-size="18" font-weight="650">当前模型</text>
    <text x="426" y="230" text-anchor="end" fill="#CAD3F5" font-size="20" font-weight="700">deepseek-v4-flash</text>
    <text x="28" y="274" fill="#A5ADCB" font-size="18" font-weight="650">剩余金额</text>
    <text x="426" y="274" text-anchor="end" fill="#A6DA95" font-size="28" font-weight="760">¥110.00</text>

    <rect x="28" y="300" width="398" height="50" rx="14" fill="#1E2030"/>
    <circle cx="54" cy="325" r="7" fill="#C59FF7"/>
    <circle cx="76" cy="325" r="7" fill="#A6DA95"/>
    <text x="96" y="332" fill="#CAD3F5" font-size="18" font-weight="650">Codex + DeepSeek 本机对话入口</text>
  </g>
</svg>
