<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Codex Quota</title>
  <desc id="desc">一个原生 macOS 菜单栏工具，用于查看 Codex 与 DeepSeek 额度、切换模型来源并维护第三方 Skill 和插件。</desc>

  <rect width="1200" height="440" rx="30" fill="#F2F2F0"/>
  <rect x="1" y="1" width="1198" height="438" rx="29" fill="none" stroke="#D8D8D4" stroke-width="2"/>

