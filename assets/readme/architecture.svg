<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Codex Quota 本地架构</title>
  <desc id="desc">Codex App Server、DeepSeek 官方接口和本机扩展来源进入 Codex Quota，再分别驱动菜单栏状态、Codex 配置与历史入口，以及 Skill 和插件维护操作。</desc>

  <rect width="1200" height="560" rx="28" fill="#24273A"/>
  <rect x="1" y="1" width="1198" height="558" rx="27" fill="none" stroke="#363A4F" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="54" y="60" fill="#CAD3F5" font-size="31" font-weight="750">三类本机输入，一个菜单栏控制面</text>
    <text x="1146" y="58" text-anchor="end" fill="#A5ADCB" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LOCAL FIRST · EXPLICIT WRITES</text>

    <text x="54" y="104" fill="#6E738D" font-size="14" font-weight="760" letter-spacing="2">INPUTS</text>
    <text x="452" y="104" fill="#6E738D" font-size="14" font-weight="760" letter-spacing="2">CONTROL SURFACE</text>
    <text x="878" y="104" fill="#6E738D" font-size="14" font-weight="760" letter-spacing="2">OUTPUTS</text>

    <g transform="translate(54 126)">
      <rect width="292" height="100" rx="17" fill="#1E2030" stroke="#C59FF7" stroke-width="2"/>
      <circle cx="28" cy="31" r="7" fill="#C59FF7"/>
      <text x="48" y="38" fill="#CAD3F5" font-size="20" font-weight="720">Codex App Server</text>
      <text x="24" y="68" fill="#A5ADCB" font-size="16">账号 · 额度窗口 · 实时事件</text>
      <text x="24" y="90" fill="#6E738D" font-size="14">本机 JSON-RPC / stdio</text>
    </g>

    <g transform="translate(54 248)">
      <rect width="292" height="100" rx="17" fill="#1E2030" stroke="#A6DA95" stroke-width="2"/>
      <circle cx="28" cy="31" r="7" fill="#A6DA95"/>
      <text x="48" y="38" fill="#CAD3F5" font-size="20" font-weight="720">DeepSeek 官方 API</text>
      <text x="24" y="68" fill="#A5ADCB" font-size="16">币种 · 余额 · API Key 校验</text>
      <text x="24" y="90" fill="#6E738D" font-size="14">/user/balance</text>
    </g>

    <g transform="translate(54 370)">
      <rect width="292" height="118" rx="17" fill="#1E2030" stroke="#EED49F" stroke-width="2"/>
      <circle cx="28" cy="31" r="7" fill="#EED49F"/>
      <text x="48" y="38" fill="#CAD3F5" font-size="20" font-weight="720">扩展来源</text>
      <text x="24" y="68" fill="#A5ADCB" font-size="16">GitHub · Well-known · 本地</text>
      <text x="24" y="92" fill="#A5ADCB" font-size="16">Codex 插件市场 · lark-cli</text>
    </g>

    <path d="M346 176H420" stroke="#C59FF7" stroke-width="3"/>
    <path d="M408 168L422 176L408 184Z" fill="#C59FF7"/>
    <path d="M346 298H420" stroke="#A6DA95" stroke-width="3"/>
