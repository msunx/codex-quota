<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="330" viewBox="0 0 1200 330"
     role="img" aria-labelledby="title desc">
  <title id="title">Codex Quota 本地数据流</title>
  <desc id="desc">当前 Codex 账号通过本机 App Server 和 JSON-RPC 将额度传递给 Codex Quota，再显示到 macOS 菜单栏。</desc>

  <rect width="1200" height="330" rx="26" fill="#24273A"/>
  <rect x="1" y="1" width="1198" height="328" rx="25" fill="none" stroke="#363A4F" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="56" y="56" fill="#CAD3F5" font-size="30" font-weight="720">额度如何到达菜单栏</text>
    <text x="1144" y="54" text-anchor="end" fill="#C59FF7" font-size="18"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LOCAL ONLY</text>

    <g transform="translate(56 98)">
      <rect width="230" height="112" rx="18" fill="#1E2030" stroke="#363A4F"/>
      <circle cx="32" cy="34" r="9" fill="#C59FF7"/>
      <text x="54" y="42" fill="#CAD3F5" font-size="23" font-weight="680">Codex / ChatGPT</text>
      <text x="24" y="82" fill="#A5ADCB" font-size="19">当前账号与工作区</text>
    </g>

    <line x1="302" y1="154" x2="344" y2="154" stroke="#A5ADCB" stroke-width="3"/>
    <path d="M344 146 L356 154 L344 162 Z" fill="#C59FF7"/>

    <g transform="translate(370 98)">
      <rect width="230" height="112" rx="18" fill="#1E2030" stroke="#363A4F"/>
      <path d="M24 28 H46 V48 H24 Z" fill="none" stroke="#C59FF7" stroke-width="2.5"/>
      <text x="58" y="42" fill="#CAD3F5" font-size="23" font-weight="680">App Server</text>
      <text x="24" y="82" fill="#A5ADCB" font-size="19">本机 stdio 通道</text>
    </g>

    <line x1="616" y1="154" x2="658" y2="154" stroke="#A5ADCB" stroke-width="3"/>
    <path d="M658 146 L670 154 L658 162 Z" fill="#C59FF7"/>

    <g transform="translate(684 98)">
      <rect width="230" height="112" rx="18" fill="#1E2030" stroke="#C59FF7" stroke-width="2"/>
      <path d="M24 44 A13 13 0 0 1 50 44" fill="none" stroke="#C59FF7" stroke-width="3" stroke-linecap="round"/>
      <path d="M37 44 L44 34" fill="none" stroke="#CAD3F5" stroke-width="3" stroke-linecap="round"/>
      <text x="62" y="42" fill="#CAD3F5" font-size="23" font-weight="680">Codex Quota</text>
      <text x="24" y="82" fill="#A5ADCB" font-size="19">解析、去重与恢复</text>
    </g>

    <line x1="930" y1="154" x2="972" y2="154" stroke="#A5ADCB" stroke-width="3"/>
    <path d="M972 146 L984 154 L972 162 Z" fill="#C59FF7"/>

    <g transform="translate(998 98)">
      <rect width="146" height="112" rx="18" fill="#1E2030" stroke="#363A4F"/>
      <rect x="22" y="24" width="102" height="30" rx="15" fill="#363A4F"/>
      <circle cx="42" cy="39" r="6" fill="#C59FF7"/>
      <text x="56" y="46" fill="#CAD3F5" font-size="19" font-weight="680">74%</text>
      <text x="22" y="82" fill="#A5ADCB" font-size="19">菜单栏</text>
    </g>

    <g transform="translate(56 264)"
       font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
       font-size="18">
      <text x="0" y="0" fill="#C59FF7">account/rateLimits/updated</text>
      <text x="356" y="0" fill="#A5ADCB">+ 30 秒兜底读取</text>
      <text x="644" y="0" fill="#A5ADCB">·</text>
      <text x="674" y="0" fill="#A5ADCB">不读取 auth.json</text>
      <text x="932" y="0" fill="#A5ADCB">·</text>
      <text x="962" y="0" fill="#A5ADCB">不保存令牌</text>
    </g>
  </g>
</svg>
