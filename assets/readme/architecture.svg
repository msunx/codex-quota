      </g>

      <g transform="translate(26 152)">
        <rect width="306" height="64" rx="14" fill="#FFFFFF" stroke="#E4E4E0"/>
        <circle cx="24" cy="32" r="6" fill="#7C3AED"/>
        <text x="44" y="29" fill="#18181A" font-size="19" font-weight="700">模型配置</text>
        <text x="44" y="52" fill="#66676D" font-size="18">备份 · 写入 · 恢复 · Keychain</text>
      </g>

      <g transform="translate(26 228)">
        <rect width="306" height="64" rx="14" fill="#FFFFFF" stroke="#E4E4E0"/>
        <circle cx="24" cy="32" r="6" fill="#E11D48"/>
        <text x="44" y="29" fill="#18181A" font-size="19" font-weight="700">历史兼容桥</text>
        <text x="44" y="52" fill="#66676D" font-size="18">仅补充 thread/list provider</text>
      </g>

      <g transform="translate(26 304)">
        <rect width="306" height="64" rx="14" fill="#FFFFFF" stroke="#E4E4E0"/>
        <circle cx="24" cy="32" r="6" fill="#D97706"/>
        <text x="44" y="29" fill="#18181A" font-size="19" font-weight="700">扩展维护</text>
        <text x="44" y="52" fill="#66676D" font-size="18">识别 · 检查 · 更新 · 卸载</text>
      </g>
    </g>

    <path d="M780 184H848" stroke="#2F7DF6" stroke-width="3"/>
    <path d="M835 176L850 184L835 192Z" fill="#2F7DF6"/>
    <path d="M780 312H848" stroke="#7C3AED" stroke-width="3"/>
    <path d="M835 304L850 312L835 320Z" fill="#7C3AED"/>
    <path d="M780 447H848" stroke="#D97706" stroke-width="3"/>
    <path d="M835 439L850 447L835 455Z" fill="#D97706"/>

    <g transform="translate(850 132)">
      <rect width="296" height="104" rx="17" fill="#FFFFFF" stroke="#D8D8D4"/>
      <text x="24" y="38" fill="#18181A" font-size="21" font-weight="720">菜单栏状态</text>
      <rect x="24" y="56" width="248" height="30" rx="15" fill="#F2F2F0"/>
      <circle cx="43" cy="71" r="5" fill="#E11D48"/>
      <text x="59" y="77" fill="#66676D" font-size="18">Codex</text>
      <text x="250" y="77" text-anchor="end" fill="#E11D48" font-size="19" font-weight="740">12%</text>
    </g>

    <g transform="translate(850 260)">
      <rect width="296" height="104" rx="17" fill="#FFFFFF" stroke="#D8D8D4"/>
      <text x="24" y="38" fill="#18181A" font-size="21" font-weight="720">Codex Desktop</text>
      <text x="24" y="70" fill="#66676D" font-size="18">应用模型配置</text>
      <text x="24" y="95" fill="#92939A" font-size="18">统一本机历史入口</text>
    </g>

    <g transform="translate(850 388)">
      <rect width="296" height="118" rx="17" fill="#FFFFFF" stroke="#D8D8D4"/>
      <text x="24" y="38" fill="#18181A" font-size="21" font-weight="720">本机扩展目录</text>
      <text x="24" y="72" fill="#66676D" font-size="18">按来源更新 · Finder 定位</text>
      <text x="24" y="100" fill="#66676D" font-size="18">完整卸载 + 安装记录清理</text>
    </g>

    <text x="54" y="560" fill="#66676D" font-size="18">默认只读；所有写入操作均由用户明确触发。</text>
    <text x="1146" y="560" text-anchor="end" fill="#92939A" font-size="18">不改写会话数据库 · 不记录对话正文</text>
  </g>
</svg>
