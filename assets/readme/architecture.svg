    <g transform="translate(852 126)">
      <rect width="294" height="100" rx="17" fill="#1E2030" stroke="#363A4F"/>
      <text x="24" y="35" fill="#CAD3F5" font-size="20" font-weight="720">菜单栏状态</text>
      <rect x="24" y="52" width="246" height="30" rx="15" fill="#24273A"/>
      <circle cx="43" cy="67" r="5" fill="#C59FF7"/>
      <text x="57" y="73" fill="#A5ADCB" font-size="15">Codex</text>
      <text x="251" y="73" text-anchor="end" fill="#C59FF7" font-size="16" font-weight="740">74%</text>
    </g>

    <g transform="translate(852 248)">
      <rect width="294" height="100" rx="17" fill="#1E2030" stroke="#363A4F"/>
      <text x="24" y="35" fill="#CAD3F5" font-size="20" font-weight="720">Codex Desktop</text>
      <text x="24" y="65" fill="#A5ADCB" font-size="16">应用新模型配置</text>
      <text x="24" y="87" fill="#6E738D" font-size="14">统一显示本机 provider 历史</text>
    </g>

    <g transform="translate(852 370)">
      <rect width="294" height="118" rx="17" fill="#1E2030" stroke="#363A4F"/>
      <text x="24" y="35" fill="#CAD3F5" font-size="20" font-weight="720">本机扩展目录</text>
      <text x="24" y="65" fill="#A5ADCB" font-size="16">按来源更新 · Finder 定位</text>
      <text x="24" y="91" fill="#A5ADCB" font-size="16">完整目录 + 安装记录清理</text>
    </g>

    <text x="54" y="530" fill="#A5ADCB" font-size="16">默认只读；配置切换、扩展更新与卸载都由用户明确触发。</text>
    <text x="1146" y="530" text-anchor="end" fill="#6E738D" font-size="15">不改写会话数据库 · 不记录对话正文</text>
  </g>
</svg>
