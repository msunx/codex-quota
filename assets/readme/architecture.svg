<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Codex Quota 本地架构</title>
  <desc id="desc">Codex App Server、DeepSeek 官方 API 和本机扩展来源进入 Codex Quota，再驱动菜单栏状态、Codex 配置、历史入口与扩展维护。</desc>

  <rect width="1200" height="600" rx="28" fill="#F2F2F0"/>
  <rect x="1" y="1" width="1198" height="598" rx="27" fill="none" stroke="#D8D8D4" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="54" y="62" fill="#18181A" font-size="36" font-weight="760">三类输入，一个本机控制面</text>
    <text x="1146" y="60" text-anchor="end" fill="#66676D" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LOCAL FIRST · EXPLICIT WRITES</text>

    <text x="54" y="108" fill="#92939A" font-size="18" font-weight="760" letter-spacing="2">INPUTS</text>
    <text x="444" y="108" fill="#92939A" font-size="18" font-weight="760" letter-spacing="2">CONTROL SURFACE</text>
    <text x="870" y="108" fill="#92939A" font-size="18" font-weight="760" letter-spacing="2">OUTPUTS</text>

    <g transform="translate(54 132)">
      <rect width="298" height="104" rx="17" fill="#FFFFFF" stroke="#2F7DF6" stroke-width="2"/>
      <circle cx="28" cy="31" r="7" fill="#2F7DF6"/>
      <text x="48" y="39" fill="#18181A" font-size="21" font-weight="720">Codex App Server</text>
      <text x="24" y="72" fill="#66676D" font-size="18">账号 · 额度窗口 · 实时事件</text>
      <text x="24" y="96" fill="#92939A" font-size="18">本机 JSON-RPC / stdio</text>
    </g>

    <g transform="translate(54 260)">
      <rect width="298" height="104" rx="17" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
      <circle cx="28" cy="31" r="7" fill="#7C3AED"/>
      <text x="48" y="39" fill="#18181A" font-size="21" font-weight="720">DeepSeek 官方 API</text>
      <text x="24" y="72" fill="#66676D" font-size="18">币种 · 余额 · API Key 校验</text>
      <text x="24" y="96" fill="#92939A" font-size="18">/user/balance</text>
    </g>

    <g transform="translate(54 388)">
      <rect width="298" height="118" rx="17" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
      <circle cx="28" cy="31" r="7" fill="#D97706"/>
      <text x="48" y="39" fill="#18181A" font-size="21" font-weight="720">本机扩展来源</text>
      <text x="24" y="74" fill="#66676D" font-size="18">GitHub · Well-known · 本地</text>
      <text x="24" y="102" fill="#66676D" font-size="18">插件市场 · lark-cli</text>
    </g>

    <path d="M352 184H420" stroke="#2F7DF6" stroke-width="3"/>
    <path d="M407 176L422 184L407 192Z" fill="#2F7DF6"/>
    <path d="M352 312H420" stroke="#7C3AED" stroke-width="3"/>
    <path d="M407 304L422 312L407 320Z" fill="#7C3AED"/>
    <path d="M352 447H420" stroke="#D97706" stroke-width="3"/>
    <path d="M407 439L422 447L407 455Z" fill="#D97706"/>

    <g transform="translate(422 122)">
      <rect width="358" height="394" rx="22" fill="#FAFAF8" stroke="#D8D8D4" stroke-width="2"/>
      <text x="28" y="48" fill="#18181A" font-size="27" font-weight="760">Codex Quota</text>
      <rect x="260" y="20" width="72" height="32" rx="11" fill="#18181A"/>
      <text x="296" y="42" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="720">AppKit</text>

      <g transform="translate(26 76)">
        <rect width="306" height="64" rx="14" fill="#FFFFFF" stroke="#E4E4E0"/>
        <circle cx="24" cy="32" r="6" fill="#2F7DF6"/>
