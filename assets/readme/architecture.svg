    <path d="M346 429H420" stroke="#EED49F" stroke-width="3"/>
    <path d="M408 421L422 429L408 437Z" fill="#EED49F"/>

    <g transform="translate(422 116)">
      <rect width="354" height="382" rx="22" fill="#1E2030" stroke="#363A4F" stroke-width="2"/>
      <text x="28" y="47" fill="#CAD3F5" font-size="25" font-weight="750">Codex Quota</text>
      <rect x="255" y="20" width="72" height="30" rx="10" fill="#363A4F"/>
      <text x="291" y="40" text-anchor="middle" fill="#B7BDF8" font-size="14" font-weight="720">AppKit</text>

      <g transform="translate(26 74)">
        <rect width="302" height="60" rx="13" fill="#24273A"/>
        <circle cx="23" cy="30" r="6" fill="#C59FF7"/>
        <text x="42" y="27" fill="#CAD3F5" font-size="17" font-weight="700">额度状态</text>
        <text x="42" y="47" fill="#6E738D" font-size="13">事件更新 + 30 秒校准 + 退避重试</text>
      </g>

      <g transform="translate(26 146)">
        <rect width="302" height="60" rx="13" fill="#24273A"/>
        <circle cx="23" cy="30" r="6" fill="#A6DA95"/>
        <text x="42" y="27" fill="#CAD3F5" font-size="17" font-weight="700">模型配置</text>
        <text x="42" y="47" fill="#6E738D" font-size="13">备份 / 写入 / 恢复 · Keychain</text>
      </g>

      <g transform="translate(26 218)">
        <rect width="302" height="60" rx="13" fill="#24273A"/>
        <circle cx="23" cy="30" r="6" fill="#B7BDF8"/>
        <text x="42" y="27" fill="#CAD3F5" font-size="17" font-weight="700">历史兼容桥</text>
        <text x="42" y="47" fill="#6E738D" font-size="13">仅补充 thread/list provider 条件</text>
      </g>

      <g transform="translate(26 290)">
        <rect width="302" height="66" rx="13" fill="#24273A"/>
        <circle cx="23" cy="30" r="6" fill="#EED49F"/>
        <text x="42" y="27" fill="#CAD3F5" font-size="17" font-weight="700">扩展维护</text>
        <text x="42" y="47" fill="#6E738D" font-size="13">识别 · 检查 · 更新 · 打开 · 卸载</text>
      </g>
    </g>

    <path d="M776 176H850" stroke="#C59FF7" stroke-width="3"/>
    <path d="M838 168L852 176L838 184Z" fill="#C59FF7"/>
    <path d="M776 298H850" stroke="#A6DA95" stroke-width="3"/>
